<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planet Maps</title>
  </head>
  <body>
    <main id="home" class="home">
      <h1>Choose a world</h1>
      <div class="bodies">
        <button class="body-btn" data-body="moon" aria-label="Open Moon map">
          <span class="globe moon">
            <canvas></canvas>
            <img src="/src/assets/moon.png" alt="" />
          </span>
          <span class="label">Moon</span>
        </button>
        <button class="body-btn" data-body="mars" aria-label="Open Mars map">
          <span class="globe mars">
            <canvas></canvas>
            <img src="/src/assets/mars.png" alt="" />
          </span>
          <span class="label">Mars</span>
        </button>
      </div>
    </main>

    <section id="map-view" class="map-view" hidden>
      <div class="top-buttons">
        <button id="back" class="map-btn">&larr; Home</button>
        <button id="menu-btn" class="map-btn" aria-expanded="false" aria-controls="menu" hidden>&#9776; Menu</button>
      </div>
      <div id="map"></div>

      <!-- Options menu (Moon and Mars) -->
      <aside id="menu" class="panel drawer" hidden aria-label="Map options">
        <div class="panel-head">
          <span class="drawer-title">Options</span>
          <button id="menu-close" class="icon-btn" aria-label="Close menu">&times;</button>
        </div>

        <section class="menu-section">
          <span class="eyebrow">View</span>
          <div id="view-options" class="view-options" role="radiogroup" aria-label="Map view"></div>
        </section>

        <section class="menu-section">
          <span class="eyebrow">Selection radius</span>
          <div id="radius-options" class="chips" role="radiogroup" aria-label="Selection radius"></div>
        </section>
      </aside>

      <!-- Area selection panel (Moon and Mars) -->
      <aside id="select-panel" class="panel" hidden>
        <p id="select-hint" class="hint">Click anywhere on the map to select an area.</p>
        <div id="select-info" hidden>
          <div class="panel-head">
            <span class="eyebrow">Selected area</span>
            <button id="clear-selection" class="icon-btn" aria-label="Clear selection">&times;</button>
          </div>
          <p id="select-coords" class="coords"></p>
          <p id="select-radius" class="sub"></p>
          <div class="actions">
            <button id="find-analogs" class="primary">Find Earth analogs</button>
            <button id="find-similar">Find similar spots</button>
          </div>
          <p id="toast" class="toast" hidden>Coming soon</p>
        </div>
      </aside>

      <!-- Shown on the Earth map when it was opened from "Find Earth analogs" -->
      <aside id="analog-banner" class="panel banner" hidden>
        <span class="eyebrow">Earth analogs for</span>
        <p id="analog-source" class="coords"></p>
        <p id="analog-radius" class="sub"></p>
        <p class="sub">Analog search coming soon.</p>
        <button id="back-to-site">&larr; Back to this site</button>
      </aside>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
