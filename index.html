<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planet Maps</title>
  </head>
  <body>
    <main id="home" class="home">
      <h1>Choose a world</h1>
      <div class="bodies">
        <button class="body-btn" data-body="earth" aria-label="Open Earth map">
          <span class="globe earth"></span><span class="label">Earth</span>
        </button>
        <button class="body-btn" data-body="moon" aria-label="Open Moon map">
          <span class="globe moon"></span><span class="label">Moon</span>
        </button>
        <button class="body-btn" data-body="mars" aria-label="Open Mars map">
          <span class="globe mars"></span><span class="label">Mars</span>
        </button>
      </div>
    </main>

    <section id="map-view" class="map-view" hidden>
      <button id="back" class="back">&larr; Home</button>
      <div id="map"></div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
